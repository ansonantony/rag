services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rag_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  adminer:
    image: adminer:latest
    ports: ["8080:8080"]
    depends_on: [postgres]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rag_app
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ["8000:8000"]
    depends_on: [postgres, qdrant]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_RAG_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  qdrant_data:
